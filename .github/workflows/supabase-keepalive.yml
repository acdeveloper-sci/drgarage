# Mantiene activo el proyecto gratuito de Supabase (se pausa tras 7 días sin actividad).
# Llama cada 3 días al endpoint de salud de la app, que hace una consulta mínima en la base.
name: supabase-keepalive

on:
  schedule:
    - cron: "17 14 */3 * *"   # cada 3 días, 9:17 a. m. hora Colombia
  workflow_dispatch: {}        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar /api/salud
        run: curl --fail --silent --show-error --max-time 30 https://drgarage.vercel.app/api/salud
